<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Name</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #222;
    }

    /* NAVBAR */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      z-index: 10;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
    }
    nav a:hover {
      text-decoration: underline;
    }

    /* HERO SECTION */
    .hero {
      min-height: 100vh;
      background-image: url("background.png");
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    /* FLOATING CARD */
    .card {
      background: rgba(255, 255, 255, 0.92);
      max-width: 900px;
      padding: 2.5rem;
      border-radius: 16px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.35);
      display: grid;
      grid-template-columns: 140px 1fr;
      gap: 2rem;
      align-items: center;
    }

    /* HEADSHOT */
    .headshot {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid #ddd;
    }

    .card h1 {
      margin: 0 0 0.5rem 0;
      font-size: 2rem;
    }

    .card p {
      margin: 0 0 1rem 0;
      color: #444;
      line-height: 1.5;
    }

    .socials {
      display: flex;
      gap: 0.75rem;
      margin-top: 0.75rem;
      justify-content: center;
    }

    .socials a {
      width: 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #f2f2f2;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .socials a:hover {
      background: #e0e0e0;
      transform: translateY(-2px);
    }

    .socials svg {
      width: 18px;
      height: 18px;
      fill: #333;
    }

    .socials svg text {
      fill: #333;
    }

    .socials a {
      width: 36px;
      height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: #f2f2f2;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    .socials a:hover {
      background: #e0e0e0;
      transform: translateY(-2px);
    }

    .socials svg {
      width: 18px;
      height: 18px;
      fill: #333;
    }

    /* RESPONSIVE */
    @media (max-width: 700px) {
      .card {
        grid-template-columns: 1fr;
        text-align: center;
      }
      .headshot {
        margin: 0 auto;
      }
    }
  </style>
</head>
