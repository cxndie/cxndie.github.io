<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jack Condie</title>

<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background-image: url("https://cxndie.github.io/background.png");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  color: #222;
  overflow-x: hidden;
}

/* NAVBAR */
nav {
  position: fixed;
  top: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 2rem;
  padding: 1rem;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(6px);
  z-index: 10;
}
nav a {
  color: #fff;
  text-decoration: none;
  font-size: 0.95rem;
  letter-spacing: 0.05em;
}
nav a:hover {
  text-decoration: underline;
}

/* SECTIONS */
section {
  display: none;
  justify-content: center;
  align-items: flex-start;
  padding: 120px 1rem 2rem 1rem;
  min-height: 100vh;
  box-sizing: border-box;
}

/* Show About only if no hash */
body:not(:has(:target)) #about {
  display: flex;
}

/* Show target only */
section:target {
  display: flex;
}

/* CARD (ABOUT) */
.card {
  background: rgba(255,255,255,0.92);
  max-width: 900px;
  padding: 2.5rem;
  border-radius: 16px;
  box-shadow: 0 30px 60px rgba(0,0,0,0.35);
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 2rem;
}

.headshot {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  object-fit: cover;
  border: 3px solid #ddd;
}

/* CV */
#cv .iframe-wrapper {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  background: transparent;
  border-radius: 16px;
  overflow: hidden;
}

#cv iframe {
  width: 100%;
  min-width: 900px;
  height: 80vh;
  border: none;
  display: block;
}

/* CONTACT FORM */
#contact .contact-wrapper {
  width: 100%;
  max-width: 640px;
  margin: 0 auto;
  background: transparent;
  border-radius: 16px;
}

.greek-form {
  background: rgba(255,255,255,0.95);
  padding: 2.5rem 2rem;
  border-radius: 16px;
  box-shadow: 0 30px 60px rgba(0,0,0,0.35);
  box-sizing: border-box;
}

.greek-form h2 {
  text-align: center;
  margin-bottom: 1.75rem;
  font-size: 1.8rem;
  color: #111;
  letter-spacing: 0.08em;
}

.greek-form input,
.greek-form textarea {
  width: 100%;
  padding: 0.9rem;
  margin-bottom: 1.2rem;
  border: 1.5px solid #111;
  border-radius: 0.5rem;
  font-size: 1rem;
  background: #fff;
  color: #111;
  box-sizing: border-box;
}

.greek-form button {
  width: 200px;
  display: block;
  margin: 1.5rem auto 0 auto;
  padding: 0.9rem 0;
  background-color: #111;
  color: #fff;
  font-weight: 600;
  border: none;
  border-radius: 0.5rem;
  cursor: pointer;
}

.greek-form button:hover {
  background-color: #333;
}

/* MOBILE */
@media (max-width: 700px) {
  .card {
    grid-template-columns: 1fr;
    text-align: center;
  }
  .headshot {
    margin: 0 auto;
  }
  #cv iframe {
    min-width: 100%;
    height: 70vh;
  }
}
</style>
</head>

<body>

<nav>
  <a href="#about">About</a>
  <a href="#cv">CV</a>
  <a href="#contact">Contact</a>
</nav>

<!-- ABOUT -->
<section id="about">
  <div class="card">
    <div>
      <img src="headshot.jpg" alt="Headshot" class="headshot">
    </div>
    <div>
      <h1>About Jack Condie</h1>
      <p>I'm a <b>PhD Student</b> at <b>The New School for Social Research</b>. I work on Ancient Philosophy, specifically Plato and self-knowledge.</p>
      <p>My dissertation is a close reading of Plato’s <i>Alcibiades</i> with attention to selfhood and political context.</p>
    </div>
  </div>
</section>

<!-- CV -->
<section id="cv">
  <div class="iframe-wrapper">
    <iframe
      src="https://docs.google.com/document/d/1kDENPQkUQfnKpXmqV0_kzdyivyei4CGNpJ3_8rxJNao/preview?rm=minimal"
      allowfullscreen>
    </iframe>
  </div>
</section>

<!-- CONTACT -->
<section id="contact">
  <div class="contact-wrapper">
    <form action="https://formspree.io/f/xgvyepvk" method="POST" class="greek-form">
      <h2>Contact<br></h2>

      <input type="text" name="name" placeholder="Your Name" required>
      <input type="email" name="email" placeholder="Your Email" required>
      <textarea name="message" rows="6" placeholder="Your Message" required></textarea>

      <!-- Honeypot -->
      <input type="text" name="_gotcha" style="display:none">

      <button type="submit">Send</button>
    </form>
  </div>
</section>

</body>
</html>
