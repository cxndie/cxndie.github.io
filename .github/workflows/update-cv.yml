name: Update CV PDF

on:
  workflow_dispatch:  # manual trigger

jobs:
  download-cv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # fetch full history to allow commits

      - name: Get default branch
        id: get_branch
        run: |
          echo "branch=$(git rev-parse --abbrev-ref origin/HEAD | sed 's|origin/||')" >> $GITHUB_OUTPUT

      - name: Download CV as PDF from Google Docs
        run: |
          curl -L -o CV-Mobile.pdf "https://docs.google.com/document/d/1kDENPQkUQfnKpXmqV0_kzdyivyei4CGNpJ3_8rxJNao/export?format=pdf"

      - name: Commit and push updated CV
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add CV-Mobile.pdf
          # Commit only if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "Update CV-Mobile.pdf from Google Docs"
            git push origin ${{ steps.get_branch.outputs.branch }}
          else
            echo "No changes to commit"
          fi
