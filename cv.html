<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jack Condie – CV</title>
<style>
body {
  margin: 0;
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background-image: url("https://cxndie.github.io/background.png");
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
  color: #222;
  overflow-x: hidden; /* prevent horizontal scroll */
}

/* NAVBAR */
nav {
  position: fixed;
  top: 0;
  width: 100%;
  display: flex;
  justify-content: center;
  gap: 2rem;
  padding: 1rem;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(6px);
  z-index: 10;
}
nav a {
  color: #fff;
  text-decoration: none;
  font-size: 0.95rem;
  letter-spacing: 0.05em;
}
nav a:hover {
  text-decoration: underline;
}

/* HERO */
.hero {
  display: flex;
  justify-content: center;
  align-items: center;  /* center vertically */
  padding: 120px 1rem 2rem 1rem;
  min-height: 100vh;     /* fit viewport height */
  box-sizing: border-box;
  background: transparent;
}

/* IFRAME WRAPPER (kept, fully transparent) */
.iframe-wrapper {
  width: 100%;
  max-width: 900px;      /* like About card */
  min-width: 300px;      /* small devices */
  background: transparent; /* fully transparent */
  border-radius: 0;       /* no visible corners */
  padding: 0;             /* remove extra padding */
  box-shadow: none;
  display: flex;
  justify-content: center;
  overflow: hidden;       /* disable horizontal scroll */
}

/* IFRAME */
iframe {
  width: 100%;
  min-width: 900px;       /* preserves Docs formatting */
  height: 80vh;           /* fill most of viewport */
  border: none;
  display: block;
  max-height: 80vh;
  overflow: auto;
}

/* MOBILE ADJUSTMENTS */
@media (max-width: 700px) {
  iframe {
    height: 70vh;
  }
  body {
    background-attachment: scroll;
  }
}
</style>
</head>
<body>

<nav>
  <a href="index.html">About</a>
  <a href="cv.html">CV</a>
  <a href="contact.html">Contact</a>
</nav>

<section class="hero">
  <div class="iframe-wrapper">
    <iframe 
      src="https://docs.google.com/document/d/1kDENPQkUQfnKpXmqV0_kzdyivyei4CGNpJ3_8rxJNao/preview?rm=minimal" 
      allowfullscreen>
    </iframe>
  </div>
</section>

</body>
</html>
