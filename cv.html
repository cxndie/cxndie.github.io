<head>

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jack Condie – CV</title>
<style>
  body {
    margin: 0;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background-image: url("https://cxndie.github.io/background.png");
    background-size: cover;
    background-position: center;
    background-attachment: fixed; /* keeps background steady */
    color: #222;
  }

  /* NAVBAR */
  nav {
    position: fixed;
    top: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 2rem;
    padding: 1rem;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(6px);
    z-index: 10;
  }
  nav a {
    color: #fff;
    text-decoration: none;
    font-size: 0.95rem;
    letter-spacing: 0.05em;
  }
  nav a:hover {
    text-decoration: underline;
  }

  /* HERO / CONTAINER */
  .hero {
    display: flex;
    justify-content: center;
    padding: 120px 1rem 2rem 1rem; /* space for navbar */
  }

  /* RESPONSIVE IFRAME */
  iframe {
    width: 100%;
    max-width: 1200px;   /* limit width on large screens */
    height: 80vh;        /* fills most of viewport height */
    border: 1px solid #ccc;
    border-radius: 8px;
    display: block;
  }

  /* MOBILE ADJUSTMENTS */
  @media (max-width: 700px) {
    iframe {
      height: 70vh;      /* shorter for small screens */
      border-radius: 6px;
    }
  }
</style>
</head>
