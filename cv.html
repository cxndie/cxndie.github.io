<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jack Condie – CV</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #111;
      color: #222;
    }

    /* NAVBAR */
    nav {
      position: fixed;
      top: 0;
      width: 100%;
      display: flex;
      justify-content: center;
      gap: 2rem;
      padding: 1rem;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(6px);
      z-index: 10;
    }
    nav a {
      color: #fff;
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 0.05em;
    }
    nav a:hover {
      text-decoration: underline;
    }

    /* HERO SECTION */
    .hero {
      min-height: 100vh;
      background-image: url("https://cxndie.github.io/background.png");
      background-size: cover;
      background-position: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 120px 2rem 2rem 2rem; /* space for fixed navbar */
    }

    /* CV CARD STYLE MATCHING ABOUT PAGE */
    .cv-container {
      max-width: 900px;          /* same as About card */
      width: 100%;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.92);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 30px 60px rgba(0,0,0,0.35);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .cv-container h1 {
      margin-top: 0;
      margin-bottom: 1rem;
      text-align: center;
      font-size: 2rem;
    }

    .cv-container iframe {
      width: 100%;
      height: 1000px;
      border: 1px solid #ccc;
      border-radius: 8px;
      display: block;
    }

    /* RESPONSIVE */
    @media (max-width: 700px) {
      .cv-container {
        padding: 1.5rem;
      }
      .cv-container iframe {
        height: 700px;
      }
    }
  </style>
</head>
<body>

  <nav>
    <a href="index.html">About</a>
    <a href="cv.html">CV</a>
    <a href="contact.html">Contact</a>
  </nav>

  <section class="hero">
    <div class="cv-container">
      <h1>Curriculum Vitae</h1>
      <iframe src="https://docs.google.com/document/d/1kDENPQkUQfnKpXmqV0_kzdyivyei4CGNpJ3_8rxJNao/preview" allowfullscreen></iframe>
    </div>
  </section>

</body>
</html>
